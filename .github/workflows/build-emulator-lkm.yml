name: Build kernelsu.ko for the emulator kernel

on:
  workflow_dispatch:

jobs:
  build-emulator-lkm:
    name: Full kernel build at sublevel 66, then module
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
    - name: Checkout module source
      uses: actions/checkout@v7

    - name: Fetch matching kernel snapshot
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU
        git config --global --add safe.directory /opt/ksrc
        git clone --depth 1 -b deprecated/android15-6.6-2025-02 \
          https://android.googlesource.com/kernel/common /opt/ksrc

    - name: Build kernel with the emulator's exact config
      run: |
        # The emulator's /proc/config.gz. The goldfish build produces the
        # symvers the module loader checks, so the whole kernel must be
        # compiled with this config for the module CRCs to match.
        cp .github/emulator-kernel-config.txt /opt/ksrc/.config
        make -C /opt/ksrc O=/opt/ksrc olddefconfig
        make -C /opt/ksrc O=/opt/ksrc -j$(nproc) \
          KCFLAGS="-Wno-error" all modules_prepare

    - name: Build kernelsu.ko against it
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU
        cd /__w/KernelSU/KernelSU/kernel
        make -C /opt/ksrc O=/opt/ksrc M=$(realpath .) src=$(realpath .) \
          modules CONFIG_KSU=m \
          KSU_PACKAGE_NAME=com.chisewaguri.kernelsu \
          KSU_EXPECTED_SIZE=0x352 \
          KSU_EXPECTED_HASH=de573d3b174b62317bd4de9dfa545580f6425454376335884eb707b871177fa3

        mkdir -p /out
        cp kernelsu.ko /out/emulator-6.6.66_kernelsu.ko
        strings /out/emulator-6.6.66_kernelsu.ko | grep -m1 vermagic || true
        strings /out/emulator-6.6.66_kernelsu.ko | grep -m1 com.chisewaguri.kernelsu || true

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: emulator-lkm
        path: /out/emulator-6.6.66_kernelsu.ko
